<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به نکسوم | Nexom</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            font-family: 'Vazirmatn', Tahoma, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        :root {
            --primary: #0088cc;
            --primary-dark: #006fa8;
            --primary-light: #e6f4fa;
            --text: #1a1a1a;
            --text-muted: #7d8b99;
        }

        body.auth-page {
            background: #0f172a;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 20px;
            position: relative;
            overflow: hidden;
        }

        body.lang-en { direction: ltr; }

        body.auth-page::before {
            content: '';
            position: absolute;
            top: -50%; right: -20%;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(0, 136, 204, 0.3) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        body.auth-page::after {
            content: '';
            position: absolute;
            bottom: -50%; left: -20%;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(118, 75, 162, 0.3) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .auth-card {
            background: #fff;
            padding: 40px 32px 32px;
            border-radius: 20px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 420px;
            text-align: center;
            position: relative;
            overflow: hidden;
            z-index: 1;
            animation: cardIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .auth-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), #764ba2, var(--primary));
            background-size: 200% 100%;
            animation: gradientMove 3s linear infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .lang-switch {
            position: absolute;
            top: 16px;
            left: 16px;
            background: var(--primary-light);
            color: var(--primary);
            border: none;
            border-radius: 8px;
            padding: 6px 12px;
            font-family: inherit;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        body.lang-en .lang-switch {
            left: auto;
            right: 16px;
        }

        .lang-switch:hover {
            background: var(--primary);
            color: white;
        }

        .lang-switch svg { width: 14px; height: 14px; fill: currentColor; }

        .auth-icon {
            width: 72px; height: 72px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, var(--primary), #764ba2);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 34px;
            box-shadow: 0 8px 24px rgba(0, 136, 204, 0.3);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .auth-card h1 {
            font-size: 24px;
            color: var(--text);
            margin-bottom: 8px;
            font-weight: 700;
        }

        .auth-subtitle {
            font-size: 13.5px;
            color: var(--text-muted);
            margin-bottom: 28px;
            line-height: 1.6;
        }

        .invite-banner {
            display: none;
            background: linear-gradient(135deg, #e6f4fa, #f0e6fa);
            border: 2px solid var(--primary);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 20px;
            font-size: 12.5px;
            color: var(--primary-dark);
            font-weight: 600;
            text-align: center;
            animation: cardIn 0.5s ease;
        }

        .invite-banner.show { display: block; }

        .invite-banner .icon { font-size: 20px; display: block; margin-bottom: 4px; }

        .auth-tabs {
            display: flex;
            gap: 4px;
            background: #f0f2f5;
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .auth-tab {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            border-radius: 9px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
        }

        .auth-tab.active {
            background: #fff;
            color: var(--primary);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .auth-input-wrap {
            position: relative;
            margin-bottom: 12px;
        }

        .auth-input-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
            opacity: 0.6;
            pointer-events: none;
        }

        body.lang-en .auth-input-icon {
            right: auto;
            left: 16px;
        }

        .auth-card input {
            width: 100%;
            padding: 14px 46px 14px 18px;
            border: 2px solid #e4e8ec;
            background: #f8fafc;
            border-radius: 12px;
            font-size: 14.5px;
            outline: none;
            transition: all 0.2s;
            font-family: inherit;
            text-align: left;
            direction: ltr;
            color: var(--text);
        }

        body.lang-en .auth-card input {
            padding: 14px 18px 14px 46px;
        }

        .auth-card input:focus {
            background: #fff;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(0, 136, 204, 0.12);
        }

        .auth-card input::placeholder {
            color: #adb5bd;
        }

        .auth-card button.submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.25s;
            box-shadow: 0 4px 15px rgba(0, 136, 204, 0.35);
            margin-top: 8px;
        }

        .auth-card button.submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 136, 204, 0.45);
        }

        .auth-card button.submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        #message-area {
            font-size: 13.5px;
            margin-top: 14px;
            min-height: 20px;
            transition: all 0.2s;
            font-weight: 600;
            line-height: 1.7;
        }

        #message-area.error { color: #ef4444; }
        #message-area.success { color: #22c55e; }

        .auth-footer {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px dashed #e4e8ec;
            font-size: 12.5px;
            color: var(--text-muted);
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 32px 22px 24px;
                border-radius: 16px;
            }
            .auth-icon { width: 64px; height: 64px; font-size: 30px; }
            .auth-card h1 { font-size: 21px; }
        }
    </style>
</head>
<body class="auth-page lang-fa">
    <div class="auth-card">
        <button class="lang-switch" id="lang-btn" title="تغییر زبان">
            <svg viewBox="0 0 24 24"><path d="M12.87 15.07l-2.54-2.51.03-.03c1.74-1.94 2.98-4.17 3.71-6.53H17V4h-7V2H8v2H1v1.99h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7l1.62-4.33L19.12 17h-3.24z"/></svg>
            <span id="lang-label">EN</span>
        </button>

        <div class="auth-icon">⚡</div>
        <h1 data-i18n="appName">نکسوم</h1>
        <p class="auth-subtitle" data-i18n="subtitle">وارد شوید یا ثبت‌نام کنید</p>

        <div class="invite-banner" id="invite-banner">
            <span class="icon">🔗</span>
            <span id="invite-banner-text">به یک گروه دعوت شده‌اید! پس از ورود، به‌طور خودکار عضو خواهید شد.</span>
        </div>

        <div class="auth-tabs">
            <button class="auth-tab active" id="tab-login" data-i18n="loginTab">ورود</button>
            <button class="auth-tab" id="tab-signup" data-i18n="signupTab">ثبت‌نام</button>
        </div>

        <div class="auth-input-wrap">
            <span class="auth-input-icon">📧</span>
            <input type="email" id="email-input" placeholder="you@example.com" autocomplete="off">
        </div>

        <div class="auth-input-wrap">
            <span class="auth-input-icon">🔒</span>
            <input type="password" id="password-input" placeholder="رمز عبور" autocomplete="off">
        </div>

        <button class="submit-btn" id="submit-btn" data-i18n="loginBtn">ورود</button>

        <p id="message-area"></p>

        <div class="auth-footer">
            <span data-i18n="footer">✨ امن و رایگان</span>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

        const SUPABASE_URL = 'https://sgjrwmnfvrpjtshlabva.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNnanJ3bW5mdnJwanRzaGxhYnZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwNTYwNzcsImV4cCI6MjEwNDYzMjA3N30._BOp-ONPTEbaM2mnGdJbdvjN-7qqA87zvannrOv02Eo';

        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const translations = {
            fa: {
                appName: 'نکسوم',
                subtitle: 'وارد شوید یا ثبت‌نام کنید',
                loginTab: 'ورود',
                signupTab: 'ثبت‌نام',
                loginBtn: 'ورود',
                signupBtn: 'ثبت‌نام',
                footer: '✨ امن و رایگان',
                emptyEmail: '⚠️ لطفاً ایمیل خود را وارد کنید',
                invalidEmail: '⚠️ فرمت ایمیل درست نیست',
                emptyPassword: '⚠️ لطفاً رمز عبور را وارد کنید',
                shortPassword: '⚠️ رمز عبور باید حداقل ۶ کاراکتر باشد',
                loginSuccess: '✅ در حال ورود...',
                signupSuccess: '✅ ثبت‌نام موفق! در حال ورود...',
                loginError: '❌ ایمیل یا رمز عبور اشتباه است',
                signupError: '❌ خطا در ثبت‌نام: ',
                loading: '⏳ لطفاً صبر کنید...',
                langTitle: 'تغییر زبان',
                pageTitle: 'ورود به نکسوم',
                inviteBanner: 'به یک گروه دعوت شده‌اید! پس از ورود، به‌طور خودکار عضو خواهید شد.',
                emailConfirm: '✅ ثبت‌نام شد. لطفاً ایمیل خود را تایید کنید.'
            },
            en: {
                appName: 'Nexom',
                subtitle: 'Sign in or sign up',
                loginTab: 'Login',
                signupTab: 'Sign Up',
                loginBtn: 'Login',
                signupBtn: 'Sign Up',
                footer: '✨ Secure & Free',
                emptyEmail: '⚠️ Please enter your email',
                invalidEmail: '⚠️ Invalid email format',
                emptyPassword: '⚠️ Please enter your password',
                shortPassword: '⚠️ Password must be at least 6 characters',
                loginSuccess: '✅ Logging in...',
                signupSuccess: '✅ Signup successful! Logging in...',
                loginError: '❌ Invalid email or password',
                signupError: '❌ Signup error: ',
                loading: '⏳ Please wait...',
                langTitle: 'Change language',
                pageTitle: 'Login to Nexom',
                inviteBanner: 'You\'ve been invited to a group! You\'ll join automatically after signing in.',
                emailConfirm: '✅ Signed up. Please confirm your email.'
            }
        };

        let currentLang = localStorage.getItem('lang') || 'fa';
        const t = (key) => translations[currentLang][key] || key;

        let currentMode = 'login';

        const applyLanguage = () => {
            document.documentElement.lang = currentLang;
            document.documentElement.dir = currentLang === 'fa' ? 'rtl' : 'ltr';
            document.body.classList.remove('lang-fa', 'lang-en');
            document.body.classList.add('lang-' + currentLang);

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.dataset.i18n;
                el.innerHTML = t(key);
            });

            const inviteText = document.getElementById('invite-banner-text');
            if (inviteText) inviteText.textContent = t('inviteBanner');

            document.getElementById('lang-label').textContent = currentLang === 'fa' ? 'EN' : 'FA';
            document.getElementById('lang-btn').title = t('langTitle');
            document.title = t('pageTitle');

            updateSubmitButton();
        };

        const updateSubmitButton = () => {
            const btn = document.getElementById('submit-btn');
            btn.textContent = currentMode === 'login' ? t('loginBtn') : t('signupBtn');
        };

        document.getElementById('tab-login').addEventListener('click', () => {
            currentMode = 'login';
            document.getElementById('tab-login').classList.add('active');
            document.getElementById('tab-signup').classList.remove('active');
            updateSubmitButton();
            document.getElementById('message-area').textContent = '';
        });

        document.getElementById('tab-signup').addEventListener('click', () => {
            currentMode = 'signup';
            document.getElementById('tab-signup').classList.add('active');
            document.getElementById('tab-login').classList.remove('active');
            updateSubmitButton();
            document.getElementById('message-area').textContent = '';
        });

        document.getElementById('lang-btn').addEventListener('click', () => {
            currentLang = currentLang === 'fa' ? 'en' : 'fa';
            localStorage.setItem('lang', currentLang);
            applyLanguage();
        });

        const emailInput = document.getElementById('email-input');
        const passwordInput = document.getElementById('password-input');
        const submitBtn = document.getElementById('submit-btn');
        const messageArea = document.getElementById('message-area');

        // ═══════════════════════════════════════════════════════
        // تشخیص لینک دعوت در URL
        // ═══════════════════════════════════════════════════════
        const params = new URLSearchParams(location.search);
        const inviteCode = params.get('invite');

        if (inviteCode) {
            localStorage.setItem('pending_invite', inviteCode);
            document.getElementById('invite-banner').classList.add('show');
        }

        // ═══════════════════════════════════════════════════════
        // ساخت URL مقصد بعد از لاگین
        // ═══════════════════════════════════════════════════════
        const buildRedirectURL = () => {
            const pending = localStorage.getItem('pending_invite') || inviteCode;
            if (pending) {
                return 'chat.html?invite=' + encodeURIComponent(pending);
            }
            return 'chat.html';
        };

        // چک کردن نشست فعلی — اگه لاگین هست، برو به chat.html
        const { data: { session } } = await supabase.auth.getSession();
        if (session?.user?.email) {
            localStorage.setItem('my_email', session.user.email);
            window.location.href = buildRedirectURL();
        }

        const handleSubmit = async () => {
            const email = emailInput.value.trim().toLowerCase();
            const password = passwordInput.value;

            if (!email) {
                messageArea.textContent = t('emptyEmail');
                messageArea.className = 'error';
                return;
            }

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                messageArea.textContent = t('invalidEmail');
                messageArea.className = 'error';
                return;
            }

            if (!password) {
                messageArea.textContent = t('emptyPassword');
                messageArea.className = 'error';
                return;
            }

            if (password.length < 6) {
                messageArea.textContent = t('shortPassword');
                messageArea.className = 'error';
                return;
            }

            submitBtn.disabled = true;
            messageArea.textContent = t('loading');
            messageArea.className = '';

            try {
                if (currentMode === 'login') {
                    const { data, error } = await supabase.auth.signInWithPassword({
                        email,
                        password,
                    });

                    if (error) {
                        messageArea.textContent = t('loginError');
                        messageArea.className = 'error';
                        submitBtn.disabled = false;
                        return;
                    }

                    if (data.session?.user?.email) {
                        localStorage.setItem('my_email', data.session.user.email);
                        messageArea.textContent = t('loginSuccess');
                        messageArea.className = 'success';

                        setTimeout(() => {
                            window.location.href = buildRedirectURL();
                        }, 500);
                    }
                } else {
                    const { data, error } = await supabase.auth.signUp({
                        email,
                        password,
                    });

                    if (error) {
                        messageArea.textContent = t('signupError') + error.message;
                        messageArea.className = 'error';
                        submitBtn.disabled = false;
                        return;
                    }

                    if (data.session?.user?.email) {
                        localStorage.setItem('my_email', data.session.user.email);
                        messageArea.textContent = t('signupSuccess');
                        messageArea.className = 'success';

                        setTimeout(() => {
                            window.location.href = buildRedirectURL();
                        }, 500);
                    } else {
                        messageArea.textContent = t('emailConfirm');
                        messageArea.className = 'success';
                        submitBtn.disabled = false;
                    }
                }
            } catch (err) {
                console.error(err);
                messageArea.textContent = '❌ ' + err.message;
                messageArea.className = 'error';
                submitBtn.disabled = false;
            }
        };

        submitBtn.addEventListener('click', handleSubmit);

        emailInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') passwordInput.focus();
        });

        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSubmit();
        });

        applyLanguage();
    </script>
</body>
</html>
