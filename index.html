<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ورود به نکسوم | Nexom</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;font-family:'Vazirmatn',Tahoma,sans-serif}

/* پس‌زمینه کهکشانی */
body.auth-page{
  background:#05061a;
  position:fixed;inset:0;
  display:flex;justify-content:center;align-items:center;
  padding:20px;overflow-y:auto;overflow-x:hidden;
}
body.lang-en{direction:ltr}

/* ستاره‌های چشمک‌زن */
body.auth-page::before{
  content:'';
  position:absolute;inset:0;
  background-image:
    radial-gradient(2px 2px at 20% 30%,#fff,transparent),
    radial-gradient(1px 1px at 60% 70%,#fff,transparent),
    radial-gradient(1px 1px at 50% 50%,#fff,transparent),
    radial-gradient(2px 2px at 80% 10%,#fff,transparent),
    radial-gradient(1px 1px at 90% 60%,#fff,transparent),
    radial-gradient(1.5px 1.5px at 15% 85%,#fff,transparent),
    radial-gradient(1px 1px at 35% 20%,#fff,transparent);
  background-size:200% 200%;
  opacity:.6;
  pointer-events:none;
  animation:twinkle 4s ease-in-out infinite;
}
@keyframes twinkle{0%,100%{opacity:.4}50%{opacity:.8}}

/* هاله‌های رنگی پس‌زمینه */
body.auth-page::after{
  content:'';
  position:absolute;inset:0;
  background:
    radial-gradient(circle at 15% 20%,rgba(0,212,255,.25),transparent 45%),
    radial-gradient(circle at 85% 80%,rgba(123,63,242,.25),transparent 45%),
    radial-gradient(circle at 50% 50%,rgba(236,72,153,.12),transparent 50%);
  pointer-events:none;
  animation:auroraMove 12s ease-in-out infinite alternate;
}
@keyframes auroraMove{
  0%{background-position:0% 0%,100% 100%,50% 50%}
  100%{background-position:100% 100%,0% 0%,50% 50%}
}

:root{
  --p:#00d4ff;
  --pu:#7b3ff2;
  --pk:#ec4899;
  --bd:rgba(0,212,255,.35);
}

/* کارت شیشه‌ای */
.auth-card{
  position:relative;
  background:rgba(15,20,60,.55);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  padding:44px 34px 34px;
  border-radius:26px;
  border:1.5px solid rgba(0,212,255,.3);
  box-shadow:
    0 25px 80px rgba(0,0,0,.6),
    0 0 60px rgba(0,212,255,.15),
    inset 0 1px 0 rgba(255,255,255,.08);
  width:100%;max-width:440px;margin:auto;
  text-align:center;
  z-index:2;
  flex-shrink:0;
  overflow:hidden;
  animation:cardIn .8s cubic-bezier(.2,.9,.3,1.3);
}
@keyframes cardIn{
  from{opacity:0;transform:translateY(30px) scale(.95)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

/* خط نئونی بالای کارت */
.auth-card::before{
  content:'';
  position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,#00d4ff,#7b3ff2,#ec4899,#00d4ff);
  background-size:300% 100%;
  animation:neonLine 4s linear infinite;
  box-shadow:0 0 20px rgba(0,212,255,.6);
}
@keyframes neonLine{0%{background-position:0% 50%}100%{background-position:300% 50%}}

/* دایره‌های تزئینی داخل کارت */
.auth-card::after{
  content:'';
  position:absolute;
  top:-120px;right:-120px;
  width:280px;height:280px;
  background:radial-gradient(circle,rgba(0,212,255,.25),transparent 70%);
  border-radius:50%;
  pointer-events:none;
  animation:orbFloat 8s ease-in-out infinite;
}
@keyframes orbFloat{0%,100%{transform:translate(0,0)}50%{transform:translate(-20px,20px)}}

/* دکمه تغییر زبان */
.lang-switch{
  position:absolute;
  top:16px;left:16px;
  background:rgba(0,212,255,.12);
  color:var(--p);
  border:1.5px solid rgba(0,212,255,.4);
  border-radius:10px;
  padding:7px 13px;
  font-family:inherit;font-size:12px;font-weight:800;
  cursor:pointer;
  transition:all .25s;
  z-index:3;
  display:flex;align-items:center;gap:5px;
  width:auto;min-width:66px;justify-content:center;
  box-shadow:0 0 15px rgba(0,212,255,.2);
}
body.lang-en .lang-switch{left:auto;right:16px}
.lang-switch:hover{
  background:linear-gradient(135deg,var(--p),var(--pu));
  color:#fff;border-color:transparent;
  box-shadow:0 0 25px rgba(0,212,255,.6);
  transform:scale(1.05);
}
.lang-switch svg{width:14px;height:14px;fill:currentColor;flex-shrink:0}

/* آیکن اصلی با درخشش */
.auth-icon{
  width:88px;height:88px;
  margin:0 auto 18px;
  background:linear-gradient(135deg,#00d4ff,#7b3ff2,#ec4899);
  background-size:200% 200%;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:40px;
  position:relative;
  box-shadow:
    0 10px 40px rgba(0,212,255,.5),
    0 0 60px rgba(123,63,242,.4),
    inset 0 -4px 12px rgba(0,0,0,.3);
  animation:iconFloat 4s ease-in-out infinite,iconGradient 6s ease infinite;
}
@keyframes iconFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes iconGradient{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

/* حلقه چرخان دور آیکن */
.auth-icon::before{
  content:'';
  position:absolute;inset:-10px;
  border-radius:50%;
  border:2px dashed rgba(0,212,255,.4);
  animation:spin 12s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* درخشش دور آیکن */
.auth-icon::after{
  content:'';
  position:absolute;inset:-4px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--p),var(--pu),var(--pk));
  z-index:-1;
  filter:blur(12px);
  opacity:.7;
  animation:pulseGlow 3s ease-in-out infinite;
}
@keyframes pulseGlow{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:.9;transform:scale(1.1)}}

/* عنوان */
.auth-card h1{
  font-size:28px;font-weight:900;
  background:linear-gradient(135deg,#00d4ff,#a855f7,#ec4899);
  background-size:200% 200%;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  margin-bottom:8px;
  animation:titleGradient 4s ease infinite;
  letter-spacing:.5px;
}
@keyframes titleGradient{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

.auth-subtitle{
  font-size:13.5px;
  color:#8b9dc3;
  margin-bottom:26px;
  line-height:1.6;
  min-height:22px;
}

/* بنر دعوت */
.invite-banner{
  display:none;
  background:linear-gradient(135deg,rgba(0,212,255,.15),rgba(123,63,242,.15));
  border:1.5px solid rgba(0,212,255,.5);
  border-radius:14px;
  padding:12px 16px;
  margin-bottom:18px;
  font-size:12.5px;
  color:#a5f3fc;
  font-weight:600;
  text-align:center;
  box-shadow:0 0 20px rgba(0,212,255,.2);
  animation:glow 2s ease-in-out infinite alternate;
}
@keyframes glow{from{box-shadow:0 0 15px rgba(0,212,255,.2)}to{box-shadow:0 0 30px rgba(0,212,255,.4)}}
.invite-banner.show{display:block}
.invite-banner .icon{font-size:20px;display:block;margin-bottom:4px}

/* تب‌های ورود/ثبت‌نام */
.auth-tabs{
  display:flex;gap:5px;
  background:rgba(0,0,0,.3);
  padding:5px;
  border-radius:14px;
  margin-bottom:22px;
  position:relative;
  border:1px solid rgba(0,212,255,.2);
}
.auth-tab{
  flex:1;
  padding:12px 0;
  border:none;
  background:transparent;
  border-radius:10px;
  font-family:inherit;font-size:14px;font-weight:700;
  color:#8b9dc3;
  cursor:pointer;
  transition:all .3s cubic-bezier(.2,.9,.3,1.2);
  position:relative;
  z-index:2;
}
.auth-tab.active{
  background:linear-gradient(135deg,var(--p),var(--pu));
  color:#fff;
  box-shadow:0 4px 20px rgba(0,212,255,.5);
  transform:scale(1.02);
}

/* فیلدهای ورودی */
.auth-input-wrap{position:relative;margin-bottom:14px}

.auth-input-icon{
  position:absolute;
  right:18px;top:50%;
  transform:translateY(-50%);
  font-size:17px;
  opacity:.8;
  pointer-events:none;
  z-index:2;
  transition:all .3s;
}
body.lang-en .auth-input-icon{right:auto;left:18px}

.auth-card input{
  width:100%;
  height:54px;
  padding:0 50px 0 18px;
  border:1.5px solid rgba(0,212,255,.2);
  background:rgba(0,0,0,.25);
  border-radius:14px;
  font-size:14.5px;
  outline:none;
  transition:all .3s;
  font-family:inherit;
  text-align:left;
  direction:ltr;
  color:#fff;
  line-height:54px;
  backdrop-filter:blur(10px);
}
body.lang-en .auth-card input{padding:0 18px 0 50px}
.auth-card input:focus{
  background:rgba(0,212,255,.08);
  border-color:var(--p);
  box-shadow:0 0 0 4px rgba(0,212,255,.15),0 0 25px rgba(0,212,255,.3);
  transform:translateY(-1px);
}
.auth-input-wrap:focus-within .auth-input-icon{
  opacity:1;
  transform:translateY(-50%) scale(1.15);
  filter:drop-shadow(0 0 8px var(--p));
}
.auth-card input::placeholder{color:#5a6b8a}

/* دکمه اصلی */
.auth-card button.submit-btn{
  width:100%;
  height:54px;
  padding:0;
  background:linear-gradient(135deg,#00d4ff,#7b3ff2,#ec4899);
  background-size:200% 200%;
  color:#fff;
  border:none;
  border-radius:14px;
  font-size:15.5px;
  font-weight:800;
  font-family:inherit;
  cursor:pointer;
  transition:all .3s cubic-bezier(.2,.9,.3,1.2);
  box-shadow:
    0 8px 25px rgba(0,212,255,.4),
    0 0 40px rgba(123,63,242,.2);
  margin-top:10px;
  display:flex;align-items:center;justify-content:center;
  position:relative;
  overflow:hidden;
  animation:btnGradient 5s ease infinite;
}
@keyframes btnGradient{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

.auth-card button.submit-btn::before{
  content:'';
  position:absolute;
  top:0;left:-100%;
  width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);
  transition:left .6s;
}
.auth-card button.submit-btn:hover:not(:disabled)::before{left:100%}

.auth-card button.submit-btn:hover:not(:disabled){
  transform:translateY(-2px) scale(1.01);
  box-shadow:
    0 12px 35px rgba(0,212,255,.6),
    0 0 60px rgba(123,63,242,.4);
}
.auth-card button.submit-btn:active:not(:disabled){transform:translateY(0) scale(.99)}
.auth-card button.submit-btn:disabled{opacity:.55;cursor:not-allowed;animation:none}

/* پیام خطا/موفقیت */
#message-area{
  font-size:13px;
  margin-top:14px;
  min-height:22px;
  transition:all .3s;
  font-weight:600;
  line-height:1.6;
}
#message-area.error{color:#ff6b6b;text-shadow:0 0 10px rgba(255,107,107,.5)}
#message-area.success{color:#4ade80;text-shadow:0 0 10px rgba(74,222,128,.5)}

/* فوتر */
.auth-footer{
  margin-top:26px;
  padding-top:20px;
  border-top:1px dashed rgba(0,212,255,.2);
  font-size:12.5px;
  color:#8b9dc3;
  min-height:40px;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.auth-footer::before{
  content:'🔒';
  font-size:14px;
  filter:drop-shadow(0 0 6px rgba(0,212,255,.5));
}

/* موبایل */
@media(max-width:480px){
  body.auth-page{padding:14px}
  .auth-card{padding:36px 24px 26px;border-radius:22px;min-height:auto}
  .auth-icon{width:76px;height:76px;font-size:34px}
  .auth-card h1{font-size:24px}
}
</style>
</head>
<body class="auth-page lang-fa">
<div class="auth-card">
  <button class="lang-switch" id="lang-btn" title="تغییر زبان">
    <svg viewBox="0 0 24 24"><path d="M12.87 15.07l-2.54-2.51.03-.03c1.74-1.94 2.98-4.17 3.71-6.53H17V4h-7V2H8v2H1v1.99h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7l1.62-4.33L19.12 17h-3.24z"/></svg>
    <span id="lang-label">EN</span>
  </button>

  <div class="auth-icon">⚡</div>
  <h1 data-i18n="appName">نکسوم</h1>
  <p class="auth-subtitle" data-i18n="subtitle">وارد شوید یا ثبت‌نام کنید</p>

  <div class="invite-banner" id="invite-banner">
    <span class="icon">🔗</span>
    <span id="invite-banner-text">به یک گروه دعوت شده‌اید! پس از ورود، به‌طور خودکار عضو خواهید شد.</span>
  </div>

  <div class="auth-tabs">
    <button class="auth-tab active" id="tab-login" data-i18n="loginTab">ورود</button>
    <button class="auth-tab" id="tab-signup" data-i18n="signupTab">ثبت‌نام</button>
  </div>

  <div class="auth-input-wrap">
    <span class="auth-input-icon">📧</span>
    <input type="email" id="email-input" placeholder="you@example.com" autocomplete="off">
  </div>

  <div class="auth-input-wrap">
    <span class="auth-input-icon">🔒</span>
    <input type="password" id="password-input" placeholder="رمز عبور" autocomplete="off">
  </div>

  <button class="submit-btn" id="submit-btn" data-i18n="loginBtn">ورود</button>
  <p id="message-area"></p>

  <div class="auth-footer">
    <span data-i18n="footer">امن و رایگان</span>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

const SUPABASE_URL = 'https://sgjrwmnfvrpjtshlabva.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNnanJ3bW5mdnJwanRzaGxhYnZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwNTYwNzcsImV4cCI6MjEwNDYzMjA3N30._BOp-ONPTEbaM2mnGdJbdvjN-7qqA87zvannrOv02Eo';

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const translations = {
  fa: {
    appName:'نکسوم', subtitle:'وارد شوید یا ثبت‌نام کنید', loginTab:'ورود', signupTab:'ثبت‌نام',
    loginBtn:'ورود', signupBtn:'ثبت‌نام', footer:'امن و رایگان',
    emptyEmail:'⚠️ لطفاً ایمیل خود را وارد کنید', invalidEmail:'⚠️ فرمت ایمیل درست نیست',
    emptyPassword:'⚠️ لطفاً رمز عبور را وارد کنید', shortPassword:'⚠️ رمز عبور باید حداقل ۶ کاراکتر باشد',
    loginSuccess:'✅ در حال ورود...', signupSuccess:'✅ ثبت‌نام موفق! در حال ورود...',
    loginError:'❌ ایمیل یا رمز عبور اشتباه است', signupError:'❌ خطا در ثبت‌نام: ',
    loading:'⏳ صبر کنید...', langTitle:'تغییر زبان', pageTitle:'ورود به نکسوم',
    inviteBanner:'به یک گروه دعوت شده‌اید! پس از ورود، به‌طور خودکار عضو خواهید شد.',
    emailConfirm:'✅ ایمیل خود را تایید کنید.'
  },
  en: {
    appName:'Nexom', subtitle:'Sign in or sign up', loginTab:'Login', signupTab:'Sign Up',
    loginBtn:'Login', signupBtn:'Sign Up', footer:'Secure & Free',
    emptyEmail:'⚠️ Please enter your email', invalidEmail:'⚠️ Invalid email format',
    emptyPassword:'⚠️ Please enter your password', shortPassword:'⚠️ Password must be at least 6 characters',
    loginSuccess:'✅ Logging in...', signupSuccess:'✅ Signup successful! Logging in...',
    loginError:'❌ Invalid email or password', signupError:'❌ Signup error: ',
    loading:'⏳ Please wait...', langTitle:'Change language', pageTitle:'Login to Nexom',
    inviteBanner:'You\'ve been invited to a group! You\'ll join automatically after signing in.',
    emailConfirm:'✅ Please confirm your email.'
  }
};

let currentLang = localStorage.getItem('lang') || 'fa';
const t = (key) => translations[currentLang][key] || key;
let currentMode = 'login';

const applyLanguage = () => {
  document.documentElement.lang = currentLang;
  document.documentElement.dir = currentLang === 'fa' ? 'rtl' : 'ltr';
  document.body.classList.remove('lang-fa', 'lang-en');
  document.body.classList.add('lang-' + currentLang);
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.innerHTML = t(el.dataset.i18n);
  });
  const inviteText = document.getElementById('invite-banner-text');
  if (inviteText) inviteText.textContent = t('inviteBanner');
  document.getElementById('lang-label').textContent = currentLang === 'fa' ? 'EN' : 'FA';
  document.getElementById('lang-btn').title = t('langTitle');
  document.title = t('pageTitle');
  updateSubmitButton();
};

const updateSubmitButton = () => {
  const btn = document.getElementById('submit-btn');
  btn.textContent = currentMode === 'login' ? t('loginBtn') : t('signupBtn');
};

document.getElementById('tab-login').addEventListener('click', () => {
  currentMode = 'login';
  document.getElementById('tab-login').classList.add('active');
  document.getElementById('tab-signup').classList.remove('active');
  updateSubmitButton();
  document.getElementById('message-area').textContent = '';
});

document.getElementById('tab-signup').addEventListener('click', () => {
  currentMode = 'signup';
  document.getElementById('tab-signup').classList.add('active');
  document.getElementById('tab-login').classList.remove('active');
  updateSubmitButton();
  document.getElementById('message-area').textContent = '';
});

document.getElementById('lang-btn').addEventListener('click', () => {
  currentLang = currentLang === 'fa' ? 'en' : 'fa';
  localStorage.setItem('lang', currentLang);
  applyLanguage();
});

const emailInput = document.getElementById('email-input');
const passwordInput = document.getElementById('password-input');
const submitBtn = document.getElementById('submit-btn');
const messageArea = document.getElementById('message-area');

const params = new URLSearchParams(location.search);
const inviteCode = params.get('invite');
if (inviteCode) {
  localStorage.setItem('pending_invite', inviteCode);
  document.getElementById('invite-banner').classList.add('show');
}

const buildRedirectURL = () => {
  const pending = localStorage.getItem('pending_invite') || inviteCode;
  if (pending) return 'chat.html?invite=' + encodeURIComponent(pending);
  return 'chat.html';
};

const { data: { session } } = await supabase.auth.getSession();
if (session?.user?.email) {
  localStorage.setItem('my_email', session.user.email);
  window.location.href = buildRedirectURL();
}

const handleSubmit = async () => {
  const email = emailInput.value.trim().toLowerCase();
  const password = passwordInput.value;
  if (!email) { messageArea.textContent = t('emptyEmail'); messageArea.className = 'error'; return; }
  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (!emailRegex.test(email)) { messageArea.textContent = t('invalidEmail'); messageArea.className = 'error'; return; }
  if (!password) { messageArea.textContent = t('emptyPassword'); messageArea.className = 'error'; return; }
  if (password.length < 6) { messageArea.textContent = t('shortPassword'); messageArea.className = 'error'; return; }

  submitBtn.disabled = true;
  messageArea.textContent = t('loading');
  messageArea.className = '';

  try {
    if (currentMode === 'login') {
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) { messageArea.textContent = t('loginError'); messageArea.className = 'error'; submitBtn.disabled = false; return; }
      if (data.session?.user?.email) {
        localStorage.setItem('my_email', data.session.user.email);
        messageArea.textContent = t('loginSuccess');
        messageArea.className = 'success';
        setTimeout(() => { window.location.href = buildRedirectURL(); }, 500);
      }
    } else {
      const { data, error } = await supabase.auth.signUp({ email, password });
      if (error) { messageArea.textContent = t('signupError') + error.message; messageArea.className = 'error'; submitBtn.disabled = false; return; }
      if (data.session?.user?.email) {
        localStorage.setItem('my_email', data.session.user.email);
        messageArea.textContent = t('signupSuccess');
        messageArea.className = 'success';
        setTimeout(() => { window.location.href = buildRedirectURL(); }, 500);
      } else {
        messageArea.textContent = t('emailConfirm');
        messageArea.className = 'success';
        submitBtn.disabled = false;
      }
    }
  } catch (err) {
    console.error(err);
    messageArea.textContent = '❌ ' + err.message;
    messageArea.className = 'error';
    submitBtn.disabled = false;
  }
};

submitBtn.addEventListener('click', handleSubmit);
emailInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') passwordInput.focus(); });
passwordInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleSubmit(); });

applyLanguage();
</script>
</body>
</html>
